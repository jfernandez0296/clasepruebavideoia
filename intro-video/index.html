<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"accent","type":"color","label":"Color de acento","default":"#8B6CFF"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0f1e;
        --ink: #f4f1ea;
        --accent: #8b6cff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: "Inter", sans-serif;
      }
      #bg {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
      }
      #bg-fill {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #bg-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2400px;
        height: 2400px;
        margin: -1200px 0 0 -1200px;
        background:
          radial-gradient(circle at 30% 35%, rgba(139, 108, 255, 0.35), transparent 38%),
          radial-gradient(circle at 72% 68%, rgba(56, 189, 248, 0.2), transparent 36%);
      }
      #palabras,
      #ia,
      #pasos,
      #final {
        z-index: 2;
      }
      #gente {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" data-layout-ignore>
        <div id="bg-fill"></div>
        <div id="bg-glow"></div>
      </div>

      <div id="palabras" data-composition-id="palabras" data-composition-src="compositions/palabras.html"
        data-start="0" data-duration="2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="ia" data-composition-id="ia" data-composition-src="compositions/ia.html"
        data-start="2" data-duration="2" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="pasos" data-composition-id="pasos" data-composition-src="compositions/pasos.html"
        data-start="4" data-duration="3" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="final" data-composition-id="final" data-composition-src="compositions/final.html"
        data-start="7" data-duration="3" data-track-index="4" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <div id="gente" data-composition-id="gente" data-composition-src="compositions/gente.html"
        data-start="0" data-duration="10" data-track-index="5" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <!-- Música: pista original generada con ElevenLabs, 120 BPM; media-start alinea el primer beat con 0 s -->
      <audio id="music" class="clip" src="assets/bgm/track.mp3" data-start="0" data-duration="10"
        data-media-start="0.035" data-volume="0.8" data-fade-out="0.8" data-track-index="10"></audio>

      <!-- Efectos de sonido sobre cada acción visible (Pixabay, ver assets/sfx/CREDITS.md) -->
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="0.5" data-volume="0.45" data-track-index="11"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop.mp3" data-start="1" data-volume="0.45" data-track-index="12"></audio>
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="1.75" data-volume="0.55" data-track-index="13"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="3" data-volume="0.7" data-track-index="14"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.78" data-volume="0.55" data-track-index="15"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/sfx/pop.mp3" data-start="4.5" data-volume="0.45" data-track-index="16"></audio>
      <audio id="sfx-pop-4" class="clip" src="assets/sfx/pop.mp3" data-start="5" data-volume="0.45" data-track-index="17"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="5.75" data-volume="0.5" data-track-index="18"></audio>
      <audio id="sfx-pop-5" class="clip" src="assets/sfx/pop.mp3" data-start="6.05" data-volume="0.5" data-track-index="19"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="7.5" data-volume="0.45" data-track-index="20"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-glow", { rotation: 0 }, { rotation: 40, duration: 10, ease: "none" }, 0);
      // La escena "ia" termina en el color de acento: el fondo lo toma en el corte
      tl.set("#bg-fill", { backgroundColor: "#8b6cff" }, 4);
      tl.set("#bg-glow", { opacity: 0.35 }, 4);
      // Colour flood de vuelta al fondo oscuro para el cierre
      tl.to("#bg-fill", { backgroundColor: "#0b0f1e", duration: 0.4, ease: "power2.inOut" }, 6.85);
      tl.to("#bg-glow", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 6.85);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
