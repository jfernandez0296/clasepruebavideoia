<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Archivo Black", sans-serif;
      color: #0b0f1e;
      overflow: hidden;
    }
    #pasos-slot {
      position: absolute;
      left: 0;
      right: 0;
      top: 300px;
      height: 300px;
      overflow: hidden;
    }
    .pasos-word {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      text-align: center;
      font-size: 230px;
      line-height: 300px;
      text-transform: uppercase;
      letter-spacing: -0.03em;
    }
    #pasos-sub {
      position: absolute;
      left: 0;
      right: 0;
      top: 650px;
      display: flex;
      justify-content: center;
      gap: 56px;
      font-family: "Inter", sans-serif;
      font-weight: 700;
      font-size: 54px;
    }
    .pasos-tag {
      display: inline-block;
    }
    #pasos-flow {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      font-size: 200px;
      letter-spacing: -0.03em;
    }
    #pasos-arrow {
      width: 220px;
      height: 26px;
      background: #0b0f1e;
      border-radius: 13px;
      transform-origin: 0% 50%;
      display: inline-block;
    }
    #pasos-html,
    #pasos-mp4 {
      display: inline-block;
    }
    #pasos-mp4 {
      color: #f4f1ea;
    }
  </style>
  <div id="root" data-composition-id="pasos" data-width="1920" data-height="1080">
    <div id="pasos-slot" class="clip" data-start="0" data-duration="1.75" data-layout-allow-overflow>
      <div class="pasos-word" id="pasos-w1">Escribe</div>
      <div class="pasos-word" id="pasos-w2">Anima</div>
      <div class="pasos-word" id="pasos-w3">Renderiza</div>
    </div>
    <div id="pasos-sub" class="clip" data-start="0" data-duration="1.75">
      <span class="pasos-tag" id="pasos-t1">HTML</span>
      <span class="pasos-tag" id="pasos-t2">GSAP</span>
      <span class="pasos-tag" id="pasos-t3">MP4</span>
    </div>
    <div id="pasos-flow" class="clip" data-start="1.7" data-duration="1.3">
      <span id="pasos-html">HTML</span>
      <span id="pasos-arrow"></span>
      <span id="pasos-mp4">MP4</span>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Tragamonedas: cada beat una palabra sube y reemplaza a la anterior
    const words = ["#pasos-w1", "#pasos-w2", "#pasos-w3"];
    const tags = ["#pasos-t1", "#pasos-t2", "#pasos-t3"];
    words.forEach((w, i) => {
      const t = i * 0.5;
      tl.fromTo(w, { yPercent: i === 0 ? 0 : 100, opacity: i === 0 ? 0 : 1, filter: "blur(10px)" },
        { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, t);
      if (i < words.length - 1)
        tl.to(w, { yPercent: -100, filter: "blur(10px)", duration: 0.16, ease: "power3.in" }, t + 0.42);
      // La etiqueta activa pasa de gris a tinta
      tl.fromTo(tags[i], { opacity: 0.3 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, t);
      if (i < tags.length - 1) tl.to(tags[i], { opacity: 0.3, duration: 0.12 }, t + 0.5);
    });
    tl.to(["#pasos-w3", "#pasos-sub"], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 1.55);
    // HTML → MP4: la flecha se dibuja y MP4 golpea en el beat
    tl.fromTo("#pasos-html", { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 1.7);
    tl.fromTo("#pasos-arrow", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.inOut" }, 1.75);
    tl.fromTo("#pasos-mp4", { opacity: 0, scale: 1.8, filter: "blur(12px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, 2.05);
    tl.to("#pasos-flow", { yPercent: -60, opacity: 0, filter: "blur(12px)", duration: 0.2, ease: "power3.in" }, 2.78);
    window.__timelines["pasos"] = tl;
  </script>
</template>
