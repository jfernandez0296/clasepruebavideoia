<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Archivo Black", sans-serif;
      color: #f4f1ea;
    }
    #palabras-stack {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 0.92;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    #palabras-stack .w {
      display: block;
      font-size: 230px;
    }
    #palabras-de {
      font-size: 120px !important;
      color: #8b6cff;
      margin: 10px 0;
    }
  </style>
  <div id="root" data-composition-id="palabras" data-width="1920" data-height="1080">
    <div id="palabras-stack" class="clip" data-start="0" data-duration="2">
      <span class="w" id="palabras-clase">Clase</span>
      <span class="w" id="palabras-de">de</span>
      <span class="w" id="palabras-prueba">Prueba</span>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Una palabra por beat (0.5 s): entra grande y desenfocada y aterriza de golpe
    const slam = (sel, t, from) =>
      tl.fromTo(sel,
        { opacity: from.opacity, scale: from.scale, filter: `blur(${from.blur}px)` },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, t);
    // La primera ya se ve en el fotograma 0 (miniatura)
    slam("#palabras-clase", 0, { opacity: 0.85, scale: 1.35, blur: 6 });
    slam("#palabras-de", 0.5, { opacity: 0, scale: 1.8, blur: 12 });
    slam("#palabras-prueba", 1.0, { opacity: 0, scale: 1.6, blur: 12 });
    // Golpe de cámara en el tercer beat
    tl.fromTo("#palabras-stack", { scale: 1 }, { scale: 1.06, duration: 0.5, ease: "power2.out" }, 1.0);
    // Salida en látigo hacia arriba
    tl.to("#palabras-stack .w",
      { yPercent: -160, opacity: 0, filter: "blur(14px)", duration: 0.22, ease: "power3.in", stagger: 0.03 }, 1.74);
    window.__timelines["palabras"] = tl;
  </script>
</template>
