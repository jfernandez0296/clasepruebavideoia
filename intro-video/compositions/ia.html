    <div id="ia-line" class="clip" data-start="0" data-duration="2" data-layout-allow-overflow>
      <span id="ia-video">Video</span>
      <span id="ia-con">con</span>

  <script>
    const tl = gsap.timeline({ paused: true });
    // Flood: un iris que se abre desde donde aterriza "IA" (beat 3.0 s global = 1.0 local)
    tl.fromTo("#ia-flood", { clipPath: "circle(0% at 74% 50%)" },
      { clipPath: "circle(150% at 74% 50%)", duration: 0.4, ease: "power2.inOut" }, 0.95);
    // "VIDEO" llega desde abajo, continuando el látigo de la escena anterior
    tl.fromTo("#ia-video", { opacity: 0, yPercent: 120, filter: "blur(14px)" },
      { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0);
    tl.fromTo("#ia-con", { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out" }, 0.5);
    // "IA" golpea en el beat, con el impacto
    tl.fromTo("#ia-ia", { opacity: 0, scale: 2.4, filter: "blur(16px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 1.0);
    // Con el flood, el texto pasa a tinta oscura
    tl.to(["#ia-video", "#ia-con"], { color: "#0b0f1e", duration: 0.2, ease: "power2.inOut" }, 1.05);
    tl.to("#ia-ia", { color: "#0b0f1e", duration: 0.2, ease: "power2.inOut" }, 1.1);
    // Zoom a través de "IA" hacia la siguiente escena
    tl.to(["#ia-video", "#ia-con"], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 1.72);
    tl.to("#ia-ia", { scale: 9, opacity: 0, duration: 0.24, ease: "power3.in", transformOrigin: "50% 55%" }, 1.74);
