  <script>
    const tl = gsap.timeline({ paused: true });
    const N = 6;
    const P = (i) => "#gente-p" + i;
    // Cambia el fotograma del sprite: estilo pixel, cortes secos, sin interpolar
    const pose = (i, name, t) => {
      tl.set(P(i) + " .f", { opacity: 0 }, t);
      tl.set(P(i) + " .f-" + name, { opacity: 1 }, t);
    };
    // Salto en el beat: sube 0.15 s, baja 0.15 s, en pasos de píxel
    const jump = (i, t, h) => {
      pose(i, "jump", t);
      tl.fromTo(P(i) + " .p-body", { y: 0 }, { y: -h, duration: 0.15, ease: "steps(4)" }, t);
      tl.to(P(i) + " .p-body", { y: 0, duration: 0.15, ease: "steps(4)" }, t + 0.15);
      pose(i, "stand", t + 0.3);
    };
    const all = (fn) => { for (let i = 1; i <= N; i++) fn(i); };

    // 0–2 s: saltan con cada palabra (beats 0, 0.5, 1.0), en ola de izquierda a derecha
    [0, 0.5, 1.0].forEach((b) => all((i) => jump(i, b + (i - 1) * 0.03, 28)));
    // 2–3 s: saludan alternando en cada medio beat
    for (let t = 2.0; t < 2.95; t += 0.25) all((i) => pose(i, ((t * 4 + i) % 2 < 1) ? "wave" : "stand", t));
    // 3.0 s: "IA" golpea → gran salto de todos
    all((i) => jump(i, 3.0, 90));
    // ~3.2 s: el flood morado cubre el fondo → siluetas en tinta oscura
    tl.fromTo("#gente-crowd", { color: "#f4f1ea" }, { color: "#0b0f1e", duration: 0.15, ease: "power2.inOut", immediateRender: false }, 3.2);
    // 4–5.5 s: entran caminando desde la izquierda (ciclo de 2 fotogramas cada 0.125 s)
    tl.fromTo("#gente-crowd", { x: -1700 }, { x: 0, duration: 1.5, ease: "steps(24)", immediateRender: false }, 4.0);
    for (let k = 0; k < 12; k++) all((i) => pose(i, (k + i) % 2 ? "walk" : "stand", 4.0 + k * 0.125));
    all((i) => pose(i, "stand", 5.5));
    // 6.05 s: "MP4" golpea → salto
    all((i) => jump(i, 6.05 + (i - 1) * 0.02, 60));
    // 7 s: vuelve el fondo oscuro → siluetas claras
    tl.to("#gente-crowd", { color: "#f4f1ea", duration: 0.2, ease: "power2.inOut" }, 6.95);
    // 7.5 s: salto de celebración con el brillo, luego saludan en cada beat hasta el final
    all((i) => jump(i, 7.5 + (i - 1) * 0.03, 70));
    for (let t = 8.0; t < 9.95; t += 0.5) all((i) => pose(i, (i % 2) ^ ((t * 2) % 2) ? "wave" : "stand", t));
    window.__timelines["gente"] = tl;
